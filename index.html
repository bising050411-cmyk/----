<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장단배우기 - 리듬게임</title>
    <style>
        :root {
            --primary-pink: #FF8E99;
            --light-pink: #FFF0F2;
            --dark-pink: #E5737F;
            --bg-color: #FFE4E6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 태블릿 프레임 */
        #app-container {
            width: 100%;
            max-width: 900px;
            height: 550px;
            background-color: var(--light-pink);
            border: 12px solid #333;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 상단 네비게이션 */
        .header {
            background-color: var(--primary-pink);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }
        .header .btn-back { cursor: pointer; font-size: 20px; }
        .header .menu-icon { font-size: 20px; }

        /* 화면 세션 공통 */
        .screen {
            flex: 1;
            display: none;
            position: relative;
            padding: 20px;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ================= 1. 대기/선택 화면 ================= */
        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .tab {
            padding: 8px 16px;
            background: #e0e0e0;
            border-radius: 8px 8px 0 0;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
        }
        .tab.active {
            background: var(--dark-pink);
            color: white;
        }

        .main-content {
            display: flex;
            gap: 15px;
            flex: 1;
        }
        .instrument-sidebar {
            width: 120px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .instrument-item {
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            background: #fafafa;
        }
        .instrument-item.active {
            border-color: var(--primary-pink);
            background: var(--light-pink);
        }
        .instrument-icon {
            width: 50px;
            height: 40px;
            margin: 0 auto 5px;
            background: #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .game-setup-box {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .setup-row {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }
        select, .btn-start {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ccc;
        }
        select { width: 250px; background: #fff;}
        .btn-start {
            background-color: #4D4DFF;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover { background-color: #3333CC; }

        .jangdan-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .preview-jangu {
            width: 100px;
            height: 60px;
            background: #E6A15C;
            border-radius: 30px;
            position: relative;
        }
        .preview-jangu::after {
            content: '';
            position: absolute;
            top: 5px; left: 45px; width: 10px; height: 50px;
            background: #BA7834;
        }

        /* ================= 2. 게임 플레이 화면 ================= */
        .game-header-info {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.7);
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* 리듬 레일 */
        .stage-area {
            position: relative;
            flex: 1;
            background: white;
            border-radius: 15px;
            border: 3px dashed var(--primary-pink);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .rail {
            position: absolute;
            left: 0; right: 0;
            height: 80px;
            background: rgba(255, 142, 153, 0.05);
            border-top: 2px solid #FFD0D4;
            border-bottom: 2px solid #FFD0D4;
            display: flex;
            align-items: center;
        }

        /* 판정선 (오른쪽에서 왼쪽으로 흐르므로 좌측에 배치) */
        .judgment-line {
            position: absolute;
            left: 120px;
            width: 60px;
            height: 60px;
            border: 4px solid var(--dark-pink);
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* 노트 스타일 */
        .note {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .note.type-kung { background: #FF5E7E; } /* 쿵 (왼쪽) */
        .note.type-tta { background: #4A90E2; }  /* 따 (오른쪽) */

        /* 터치/키 입력용 북 패드 비주얼 */
        .pad-container {
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            margin-top: auto;
            margin-bottom: 10px;
        }
        .drum-pad {
            width: 140px;
            height: 140px;
            background: #FFE0B2;
            border: 8px solid #E6A15C;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #795548;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 6px #BCAAA4;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .drum-pad:active, .drum-pad.pressed {
            transform: translateY(6px);
            box-shadow: 0 0px #BCAAA4;
            background: #FFCC80;
        }
        .drum-pad span { font-size: 12px; color: #8D6E63; margin-top: 4px; }

        /* 판정 텍스트 팝업 (좋다! 얼씨구!) */
        .judge-toast {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 38px;
            font-weight: bold;
            color: #2ECC71;
            text-shadow: 2px 2px 0px #white, -2px -2px 0px white;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        /* ================= 3. 결과 화면 ================= */
        .result-box {
            background: white;
            border-radius: 15px;
            flex: 1;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .result-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px dashed #eee;
        }
        .result-right {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            padding-left: 10px;
        }
        .score-title { font-size: 20px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .stars { color: #FFD700; font-size: 28px; margin-bottom: 10px; letter-spacing: 2px; }
        .total-score { font-size: 64px; font-weight: bold; color: #444; }
        
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: #666;
        }
        .score-label-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
            margin-right: 6px;
        }
        .badge-combo { background: #FF8E99; }
        .badge-perfect { background: #2ECC71; }
        .badge-good { background: #3498DB; }
        .badge-normal { background: #F1C40F; }
        .badge-miss { background: #E74C3C; }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .btn-action {
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            color: white;
        }
        .btn-retry { background: #4A90E2; }
        .btn-save { background: #E67E22; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 네비게이션 헤더 -->
    <div class="header">
        <span class="btn-back" onclick="goBack()">➔</span>
        <span id="header-title">장단배우기</span>
        <span class="menu-icon">☰</span>
    </div>

    <!-- 1. 대기 및 설정 화면 -->
    <div id="screen-setup" class="screen active">
        <div class="tab-container">
            <div class="tab active">장단 익히기</div>
            <div class="tab">장단꼴 만들기</div>
        </div>

        <div class="main-content">
            <!-- 악기 선택 사이드바 -->
            <div class="instrument-sidebar">
                <div class="instrument-item active">
                    <div class="instrument-icon">🪘</div>
                    장구
                </div>
                <div class="instrument-item">
                    <div class="instrument-icon">🟡</div>
                    괭과리
                </div>
                <div class="instrument-item">
                    <div class="instrument-icon">🥞</div>
                    징
                </div>
                <div class="instrument-item">
                    <div class="instrument-icon">🥁</div>
                    북
                </div>
            </div>

            <!-- 중심 설정 구역 -->
            <div class="game-setup-box">
                <h3 style="color: var(--dark-pink);">자진모리 장단 게임</h3>
                <div class="jangdan-preview">
                    <div class="preview-jangu"></div>
                </div>
                
                <div class="setup-row">
                    <select id="song-select">
                        <option value="고사리">고사리꺾자 (성악)</option>
                        <option value="개고리">개고리 개골청 (반주)</option>
                        <option value="경복궁">경복궁타령 (성악)</option>
                        <option value="풍구">풍구타령 (반주)</option>
                    </select>
                    <button class="btn-start" onclick="startGame()">시작</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 게임 플레이 화면 -->
    <div id="screen-game" class="screen">
        <div class="game-header-info">
            <span id="playing-song-title">곡명: 고사리꺾자</span>
            <span>SCORE: <span id="live-score">0</span></span>
            <span>COMBO: <span id="live-combo">0</span></span>
        </div>

        <!-- 리듬 플레이 영역 -->
        <div class="stage-area">
            <div class="judge-toast" id="judge-toast">좋다!</div>
            <div class="rail">
                <div class="judgment-line"></div>
                <!-- 노트들이 들어갈 구역 -->
                <div id="note-zone" style="position: absolute; width:100%; height:100%;"></div>
            </div>
        </div>

        <!-- 입력 패드 구역 -->
        <div class="pad-container">
            <div class="drum-pad" id="pad-left" onmousedown="triggerHit('kung')" ontouchstart="triggerHit('kung')">
                덩 / 쿵
                <span>[ A 키 ]</span>
            </div>
            <div class="drum-pad" id="pad-right" onmousedown="triggerHit('tta')" ontouchstart="triggerHit('tta')">
                따
                <span>[ L 키 ]</span>
            </div>
        </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="screen-result" class="screen">
        <div class="tab-container">
            <div class="tab active">장단게임 결과</div>
        </div>

        <div class="result-box">
            <div class="result-left">
                <div class="score-title">총점</div>
                <div class="stars" id="result-stars">★★★★★</div>
                <div class="total-score" id="result-score">0</div>
                <div style="background:#FFF9C4; padding:5px 15px; border-radius:15px; font-weight:bold; color:#F57F17; margin-top:10px;">
                    참 잘했어요~!
                </div>
            </div>

            <div class="result-right">
                <div class="score-row">
                    <span><span class="score-label-badge badge-combo">최대 콤보</span></span>
                    <span id="res-combo">0 개</span>
                </div>
                <div class="score-row">
                    <span><span class="score-label-badge badge-perfect">매우좋음</span></span>
                    <span id="res-perfect">0 개</span>
                </div>
                <div class="score-row">
                    <span><span class="score-label-badge badge-good">좋음</span></span>
                    <span id="res-good">0 개</span>
                </div>
                <div class="score-row">
                    <span><span class="score-label-badge badge-normal">보통</span></span>
                    <span id="res-normal">0 개</span>
                </div>
                <div class="score-row">
                    <span><span class="score-label-badge badge-miss">실패</span></span>
                    <span id="res-miss">0 개</span>
                </div>
            </div>
        </div>

        <div class="result-buttons">
            <button class="btn-action btn-retry" onclick="restartSetup()">다시하기</button>
            <button class="btn-action btn-save" onclick="alert('점수가 저장되었습니다!')">저장하기</button>
        </div>
    </div>
</div>

<script>
    // 장단 게임 데이터 및 상태 변수
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let gameInterval = null;
    let noteSpawnTimeout = null;
    let activeNotes = [];
    let gameRunning = false;

    // 판정 카운터
    let countPerfect = 0;
    let countGood = 0;
    let countNormal = 0;
    let countMiss = 0;

    // 자진모리 기본 리듬 배치 패턴 (시간 간격 ms, 타입 'kung' 또는 'tta')
    const jajinmoriPattern = [
        { time: 500, type: 'kung' },
        { time: 900, type: 'tta' },
        { time: 1300, type: 'kung' },
        { time: 1700, type: 'tta' },
        { time: 2100, type: 'kung' },
        { time: 2300, type: 'tta' },
        { time: 2500, type: 'kung' },
        { time: 2900, type: 'tta' },
        { time: 3300, type: 'kung' },
        { time: 3700, type: 'tta' },
        { time: 4100, type: 'kung' },
        { time: 4300, type: 'tta' }
    ];

    // 화면 전환 함수
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 게임 시작
    function startGame() {
        const selectObj = document.getElementById('song-select');
        const selectedSong = selectObj.options[selectObj.selectedIndex].text;
        document.getElementById('playing-song-title').innerText = "곡명: " + selectedSong;
        document.getElementById('header-title').innerText = "장단게임 플레이";

        // 초기화
        score = 0;
        combo = 0;
        maxCombo = 0;
        countPerfect = 0;
        countGood = 0;
        countNormal = 0;
        countMiss = 0;
        activeNotes = [];
        document.getElementById('note-zone').innerHTML = '';
        updateUI();

        showScreen('screen-game');
        gameRunning = true;

        // 노트 소환 시작
        const startTime = Date.now();
        jajinmoriPattern.forEach(noteData => {
            noteSpawnTimeout = setTimeout(() => {
                if(gameRunning) spawnNote(noteData.type);
            }, noteData.time);
        });

        // 애니메이션 프레임 루프 구동
        gameInterval = setInterval(updateNotes, 20);

        // 패턴 종료 후 6.5초 뒤 결과창 이동
        setTimeout(() => {
            if(gameRunning) endGame();
        }, 6500);
    }

    // 노트 생성
    function spawnNote(type) {
        const zone = document.getElementById('note-zone');
        const noteEl = document.createElement('div');
        noteEl.classList.add('note', `type-${type}`);
        noteEl.innerText = type === 'kung' ? '쿵' : '따';
        noteEl.style.left = '850px'; 
        zone.appendChild(noteEl);

        activeNotes.push({
            element: noteEl,
            position: 850,
            type: type
        });
    }

    // 노트 이동 및 경계 만료 처리
    function updateNotes() {
        for (let i = activeNotes.length - 1; i >= 0; i--) {
            let note = activeNotes[i];
            note.position -= 5;
            note.element.style.left = note.position + 'px';

            if (note.position < 50) {
                note.element.remove();
                activeNotes.splice(i, 1);
                triggerMiss();
            }
        }
    }

    // 유저 입력 처리
    function triggerHit(type) {
        if (!gameRunning) return;

        const targetPos = 120;
        let judged = false;

        for (let i = 0; i < activeNotes.length; i++) {
            let note = activeNotes[i];
            if (note.type === type) {
                let distance = Math.abs(note.position - targetPos);

                if (distance < 25) {
                    showToast('좋다! (매우좋음)', '#2ECC71');
                    score += 15;
                    combo++;
                    countPerfect++;
                    judged = true;
                } else if (distance < 45) {
                    showToast('얼씨구 (좋음)', '#3498DB');
                    score += 10;
                    combo++;
                    countGood++;
                    judged = true;
                } else if (distance < 70) {
                    showToast('보통', '#F1C40F');
                    score += 5;
                    combo++;
                    countNormal++;
                    judged = true;
                }

                if (judged) {
                    if (combo > maxCombo) maxCombo = combo;
                    note.element.remove();
                    activeNotes.splice(i, 1);
                    break;
                }
            }
        }

        if (!judged) {
            triggerMiss();
        }
        updateUI();
    }

    function triggerMiss() {
        combo = 0;
        countMiss++;
        showToast('실패', '#E74C3C');
        updateUI();
    }

    function updateUI() {
        document.getElementById('live-score').innerText = score;
        document.getElementById('live-combo').innerText = combo;
    }

    function showToast(text, color) {
        const toast = document.getElementById('judge-toast');
        toast.innerText = text;
        toast.style.color = color;
        toast.style.animation = 'none';
        void toast.offsetWidth;
        toast.style.animation = 'popUp 0.4s ease-out forwards';
    }

    function endGame() {
        gameRunning = false;
        clearInterval(gameInterval);
        clearTimeout(noteSpawnTimeout);
        
        document.getElementById('result-score').innerText = score;
        document.getElementById('res-combo').innerText = maxCombo + " 개";
        document.getElementById('res-perfect').innerText = countPerfect + " 개";
        document.getElementById('res-good').innerText = countGood + " 개";
        document.getElementById('res-normal').innerText = countNormal + " 개";
        document.getElementById('res-miss').innerText = countMiss + " 개";

        let stars = '★★★☆☆';
        if (score > 120) stars = '★★★★★';
        else if (score > 80) stars = '★★★★☆';
        else if (score > 40) stars = '★★★☆☆';
        else stars = '★★☆☆☆';
        document.getElementById('result-stars').innerText = stars;

        document.getElementById('header-title').innerText = "장단게임 결과";
        showScreen('screen-result');
    }

    function restartSetup() {
        document.getElementById('header-title').innerText = "장단배우기";
        showScreen('screen-setup');
    }

    function goBack() {
        restartSetup();
    }

    window.addEventListener('keydown', (e) => {
        if(e.repeat) return;
        if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') {
            const pad = document.getElementById('pad-left');
            pad.classList.add('pressed');
            triggerHit('kung');
        }
        if (e.key === 'l' || e.key === 'L' || e.key === 'ㅣ') {
            const pad = document.getElementById('pad-right');
            pad.classList.add('pressed');
            triggerHit('tta');
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') {
            document.getElementById('pad-left').classList.remove('pressed');
        }
        if (e.key === 'l' || e.key === 'L' || e.key === 'ㅣ') {
            document.getElementById('pad-right').classList.remove('pressed');
        }
    });
</script>

</body>
</html>
